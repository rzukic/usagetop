<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#24242C"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6B93C9"/>
      <stop offset="1" stop-color="#9CC0F0"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E0A33C"/>
      <stop offset="1" stop-color="#F4CB7A"/>
    </linearGradient>
  </defs>
  <!-- The tile: dark glass with a lit top edge, as the panel's cards. -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#tile)"/>
  <rect x="2.5" y="2.5" width="95" height="95" rx="21.5" fill="none" stroke="url(#edge)" stroke-width="1"/>
  <!-- Three limits as the panel draws them: a track, what is left, the pace tick. -->
  <g>
    <rect x="20" y="24" width="60" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="20" y="24" width="46" height="11" rx="5.5" fill="url(#blue)"/>
    <rect x="56.5" y="20.5" width="3" height="18" rx="1.5" fill="#F2F2F2"/>

    <rect x="20" y="44.5" width="60" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="20" y="44.5" width="22" height="11" rx="5.5" fill="url(#amber)"/>
    <rect x="45.5" y="41" width="3" height="18" rx="1.5" fill="#F2F2F2"/>

    <rect x="20" y="65" width="60" height="11" rx="5.5" fill="#FFFFFF" fill-opacity="0.14"/>
    <rect x="20" y="65" width="36" height="11" rx="5.5" fill="url(#blue)"/>
    <rect x="50.5" y="61.5" width="3" height="18" rx="1.5" fill="#F2F2F2"/>
  </g>
</svg>
